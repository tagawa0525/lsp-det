[package]
name = "lsp-det"
version = "0.7.1"
edition = "2024"
description = "Transparent LSP proxy that removes language servers' silent lies. Reference implementation of the server state protocol"
repository = "https://github.com/tagawa0525/lsp-det"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["lsp", "language-server", "proxy", "agents"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
libc = "0.2"
